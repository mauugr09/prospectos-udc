# Integración y entrega continuas (CI/CD).
#  1. ITV: estilo, seguridad del código, dependencias con fallas conocidas, migraciones y pruebas con cobertura.
#     Corre en cada pull request y en cada push a main; si no pasa, no se compila nada y el cambio no se puede unir a main.
#  2. Pruebas con MariaDB.
#  3. Solo en main o con una etiqueta v1.2.3: compila y prueba en Windows y Mac reales (Prospectos-windows.zip y .dmg).
#     Con una etiqueta además publica un «Release» con los dos archivos (la entrega).
name: ITV y compilación
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]   # las demás ramas pasan por pull request (así no corre dos veces)
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # solo para publicar el Release de una etiqueta

jobs:
  itv:
    name: ITV (revisión del código)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.13', cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ITV
        shell: bash
        env: { PYTHON: python }
        run: |
          set +eo pipefail
          bash empaquetado/itv.sh 2>&1 | tee salida.txt; r=${PIPESTATUS[0]}
          [ $r -eq 0 ] || grep -E '✗|FAILED|ERROR|error:' salida.txt | tail -15 | sed 's/^/::error::/'
          exit $r

  pruebas:
    name: Pruebas con MariaDB
    needs: itv
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: raiz
          MARIADB_DATABASE: prospectos
          MARIADB_USER: prospectos
          MARIADB_PASSWORD: Clave-Prueba-123
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.13', cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Los errores se repiten como «anotaciones» (::error::) para leerlos sin abrir el registro completo.
      - name: Cliente de MariaDB (mariadb-dump para la prueba de respaldos)
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client
      - name: Pruebas con MariaDB
        shell: bash
        env:
          PROSPECTOS_BD_JSON: '{"MOTOR":"mariadb","HOST":"127.0.0.1","PUERTO":3307,"NOMBRE":"prospectos","USUARIO":"root","CLAVE":"raiz"}'
        run: |
          set +eo pipefail
          pytest --ds=config.settings_pruebas_mariadb 2>&1 | tee salida.txt; r=${PIPESTATUS[0]}
          [ $r -eq 0 ] || tail -10 salida.txt | sed 's/^/::error::/'
          exit $r

  windows:
    needs: pruebas
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.13', cache: pip }
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - name: Ejecutable
        env: { PROSPECTOS_DATOS: '${{ runner.temp }}\construir' }
        run: |
          python manage.py collectstatic --noinput -v0
          python -m PyInstaller --noconfirm prospectos.spec
      - name: Prueba de humo (comandos, servidor local y HTTPS en red)
        shell: pwsh
        env: { PROSPECTOS_DATOS: '${{ runner.temp }}\humo' }
        run: |
          $ErrorActionPreference = 'Stop'
          function Falla($msg) { Write-Output "::error::$msg"; if ($script:p) { Stop-Process $script:p -Force -ErrorAction SilentlyContinue }; exit 1 }
          $exe = ".\dist\Prospectos\Prospectos.exe"
          foreach ($cmd in @('preparar', 'demo --familias 20', 'respaldo crear')) {
            $salida = & $exe $cmd.Split(' ') 2>&1
            if ($LASTEXITCODE) { $salida | Select-Object -Last 8 | ForEach-Object { Write-Output "::error::$_" }; Falla "Falló: Prospectos.exe $cmd" }
          }
          $cfg = Join-Path $env:PROSPECTOS_DATOS 'config.json'
          $j = Get-Content $cfg -Raw | ConvertFrom-Json; $j | Add-Member EN_RED $true -Force
          $j | ConvertTo-Json -Depth 10 | Set-Content $cfg -Encoding utf8
          $script:p = Start-Process $exe -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\salida.txt" -RedirectStandardError "$env:RUNNER_TEMP\errores.txt"
          $ok = $false
          foreach ($i in 1..60) { Start-Sleep 2; try { $r = Invoke-WebRequest http://127.0.0.1:8000/salud/ -UseBasicParsing; if ($r.Content -like 'prospectos-ok*') { $ok = $true; break } } catch {} }
          Get-Content "$env:RUNNER_TEMP\salida.txt"
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\errores.txt" | Select-Object -Last 10 | ForEach-Object { Write-Output "::error::$_" }; Falla 'El servidor local no respondió' }
          Start-Sleep 3
          $ca = Join-Path $env:PROSPECTOS_DATOS 'red\ca.crt'
          if (-not (Test-Path $ca)) { Get-Content "$env:RUNNER_TEMP\salida.txt" | ForEach-Object { Write-Output "::error::$_" }; Falla 'No se creó el certificado de red' }
          # Windows (Schannel) revisaría la lista de revocación, que una autoridad local no publica: --ssl-no-revoke.
          $r = curl.exe --fail -sS --ssl-no-revoke --cacert $ca https://localhost:8443/salud/ 2>&1
          if ($LASTEXITCODE) { Falla "HTTPS en red: $r" }
          $r = curl.exe --fail -sS --ssl-no-revoke -o NUL -w "%{http_code}" --cacert $ca https://localhost:8443/admin/login/ 2>&1
          if ($LASTEXITCODE) { Falla "Login por HTTPS: $r" }
          Write-Output "HTTPS en red: login $r"
          # El archivo de un clic «Conectar a Prospectos.cmd» con Windows PowerShell 5.1 real (sin instalar el certificado).
          & $exe instalador_conexion --salida "$env:RUNNER_TEMP\conectar.cmd" --direccion https://no-existe.invalid:8443/ --direccion https://localhost:8443/
          if ($LASTEXITCODE) { Falla 'No se generó Conectar a Prospectos.cmd' }
          $env:PROSPECTOS_SIN_INSTALAR = '1'
          $salida = cmd /c "echo.| `"$env:RUNNER_TEMP\conectar.cmd`"" 2>&1 | Out-String
          Write-Output $salida
          if ($salida -notmatch 'Certificado comprobado') { Falla 'Conectar a Prospectos.cmd no comprobó el certificado' }
          Stop-Process $script:p -Force
      - name: Empaquetar
        shell: pwsh
        run: |
          Copy-Item empaquetado\LEEME-windows.txt dist\Prospectos\LEEME.txt
          Copy-Item LICENSE, AVISOS-TERCEROS.md dist\Prospectos\
          Copy-Item docs dist\Prospectos\docs -Recurse -Exclude diagramas
          # Notas internas que no van a la UDC
          Remove-Item dist\Prospectos\docs\autoria.md, dist\Prospectos\docs\decisiones.md -ErrorAction SilentlyContinue
          Remove-Item dist\Prospectos\docs\diagramas -Recurse -ErrorAction SilentlyContinue
          (Get-FileHash dist\Prospectos\Prospectos.exe -Algorithm SHA256).Hash | Set-Content dist\Prospectos\SHA256-Prospectos.exe.txt
          Compress-Archive dist\Prospectos dist\Prospectos-windows.zip
      - uses: actions/upload-artifact@v5
        with: { name: Prospectos-windows, path: dist/Prospectos-windows.zip, retention-days: 30 }

  mac:
    needs: pruebas
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-15   # chip Apple (arm64)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.13', cache: pip }
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - name: Prospectos.app y .dmg
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.{0}', github.run_number) }}
        run: bash empaquetado/mac/construir.sh "${VERSION#v}"
      - name: Prueba de humo (comandos, servidor local y HTTPS en red)
        env: { PROSPECTOS_DATOS: '${{ runner.temp }}/humo' }
        run: |
          set -e
          trap 'grep -iE "aviso|error|exception" "$RUNNER_TEMP/salida.txt" 2>/dev/null | tail -6 | sed "s/^/::error::/"' ERR
          APP=dist/Prospectos.app/Contents/MacOS/Prospectos
          file dist/Prospectos.app/Contents/Resources/prospectos/Prospectos | grep -q arm64
          "$APP" preparar
          "$APP" demo --familias 20
          "$APP" respaldo crear
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['PROSPECTOS_DATOS']) / 'config.json'
          d = json.loads(p.read_text()); d['EN_RED'] = True; p.write_text(json.dumps(d))
          PY
          # Sin argumentos y sin terminal real: el lanzador abriría Terminal; se prueba el programa interno.
          dist/Prospectos.app/Contents/Resources/prospectos/Prospectos < /dev/null > "$RUNNER_TEMP/salida.txt" 2>&1 &
          PID=$!
          for i in $(seq 1 60); do sleep 2; curl -fsS http://127.0.0.1:8000/salud/ 2>/dev/null | grep -q prospectos-ok && break; done
          cat "$RUNNER_TEMP/salida.txt"
          curl -fsS http://127.0.0.1:8000/salud/ | grep -q prospectos-ok
          curl -fsS --cacert "$PROSPECTOS_DATOS/red/ca.crt" https://localhost:8443/salud/ | grep -q prospectos-ok
          curl -fsS -o /dev/null -w "%{http_code} login\n" --cacert "$PROSPECTOS_DATOS/red/ca.crt" https://localhost:8443/admin/login/
          pgrep -f "caffeinate -i -s -w $PID" > /dev/null && echo "caffeinate activo"
          test -f "$HOME/Library/Application Support/Prospectos UDC/config.json" && { echo "No debe usar la carpeta por omisión con PROSPECTOS_DATOS"; exit 1; } || true
          kill $PID
      - name: Carpeta de datos por omisión (sin PROSPECTOS_DATOS)
        run: |
          dist/Prospectos.app/Contents/MacOS/Prospectos preparar
          test -f "$HOME/Library/Application Support/Prospectos UDC/config.json"
          test ! -e dist/Prospectos.app/Contents/Resources/prospectos/datos
      - uses: actions/upload-artifact@v5
        with: { name: Prospectos-mac, path: dist/Prospectos-mac.dmg, retention-days: 30 }

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Prospectos-windows/Prospectos-windows.zip
            Prospectos-mac/Prospectos-mac.dmg
